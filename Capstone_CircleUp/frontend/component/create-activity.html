<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CircleUp — Create Activity</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/create-activity.css" />
    <script src="../js/fetch-interceptor.js"></script>
  </head>
  <body>
    <nav class="nav">
      <a class="logo" href="./browse.html">
        <div class="logo-mark">
          <i class="ti ti-circles-relation" aria-hidden="true"></i>
        </div>
        CircleUp
      </a>
      <div class="nav-right">
        <a href="./browse.html" class="nav-link">
          <i class="ti ti-arrow-left"></i> Back
        </a>
        <button class="btn-ghost" onclick="logout()">Log out</button>
      </div>
    </nav>

    <div class="form-page">
      <div class="form-header">
        <h1>Create an activity</h1>
        <p>Plan something fun and invite people to join</p>
      </div>

      <div class="form-card" id="create-form">
        <div class="field">
          <label for="title">Activity title</label>
          <input
            type="text"
            id="title"
            placeholder="Sunday morning yoga, pottery workshop..."
            maxlength="200"
          />
          <div class="field-error" id="title-error"></div>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea
            id="description"
            rows="3"
            placeholder="Tell people what to expect, what to bring, what the vibe is..."
          ></textarea>
          <div class="field-error" id="description-error"></div>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option value="">Select category</option>
              <option value="Sports">Sports</option>
              <option value="Art">Art</option>
              <option value="Wellness">Wellness</option>
              <option value="Food">Food</option>
              <option value="Outdoors">Outdoors</option>
              <option value="Learning">Learning</option>
              <option value="Social">Social</option>
              <option value="Music">Music</option>
            </select>
            <div class="field-error" id="category-error"></div>
          </div>
          <div class="field">
            <label for="location">Location</label>
            <select id="location">
              <option value="">Select city</option>
              <option value="Bangalore">Bangalore</option>
              <option value="Indore">Indore</option>
              <option value="Bhopal">Bhopal</option>
              <option value="Delhi">Delhi</option>
              <option value="Mumbai">Mumbai</option>
              <option value="Jabalpur">Jabalpur</option>
              <option value="Kolkata">Kolkata</option>
              <option value="Chennai">Chennai</option>
              <option value="Pune">Pune</option>
              <option value="Goa">Goa</option>
              <option value="Hyderabad">Hyderabad</option>
              <option value="Virtual">Virtual</option>
            </select>
            <div class="field-error" id="location-error"></div>
          </div>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="activity-date">Date & time</label>
            <input type="datetime-local" id="activity-date" />
            <div class="field-error" id="activity-date-error"></div>
          </div>
          <div class="field">
            <label for="max-participants">Max participants</label>
            <input
              type="number"
              id="max-participants"
              placeholder="10"
              min="1"
              max="1000"
            />
            <div class="field-error" id="max-participants-error"></div>
          </div>
        </div>

        <div class="field">
          <label for="gender-filter">Who can join?</label>
          <select id="gender-filter">
            <option value="all">Everyone</option>
            <option value="female_only">Girls only</option>
          </select>
          <div class="field-error" id="gender-filter-error"></div>
        </div>

        <div class="form-btns">
          <button class="submit-btn" id="create-btn" onclick="createActivity()">
            <i class="ti ti-sparkles"></i> Create activity
          </button>
          <button class="btn-cancel-form" onclick="window.history.back()">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <footer class="footer">
      CircleUp &copy; 2026 — find your people, find your vibe.
    </footer>

    <script type="module" src="../js/create-activity.js"></script>
  </body>
</html>
