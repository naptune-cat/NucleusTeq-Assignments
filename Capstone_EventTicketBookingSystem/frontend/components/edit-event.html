<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Event</title>
    <link rel="stylesheet" href="../css/edit-event.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/edit-event.css" />
  </head>
  <body>
    <nav class="navbar">
      <h2>Evently <i class="fa-solid fa-ticket"></i></h2>
      <button onclick="window.location.href = 'dashboard.html'">
        <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
      </button>
    </nav>

    <div class="edit-container">
      <h2><i class="fa-solid fa-pen"></i> Edit Event</h2>
      <form id="editForm">
        <input type="text" id="name" placeholder="Event Name" required />
        <input type="text" id="venue" placeholder="Venue" required />
        <input type="datetime-local" id="date" required />
        <input type="number" id="seats" placeholder="Total Seats" required />
        <input type="number" id="price" placeholder="Ticket Price" required />
        <input
          type="text"
          id="description"
          placeholder="Description"
          required
        />
        <input type="text" id="category" placeholder="Category" />
        <button type="submit">
          <i class="fa-solid fa-floppy-disk"></i> Save Changes
        </button>
      </form>
    </div>

    <div class="toast" id="toast"></div>
    <script src="../js/edit-event.js"></script>
    <script src="../js/api.js"></script>
  </body>
</html>
