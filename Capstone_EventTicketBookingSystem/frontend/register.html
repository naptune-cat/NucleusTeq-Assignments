<!doctype html>

    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="./css/register.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    </head>

    <body>
        <div class="container">
            <h1>Start your journey</h1>
            <p>Create an account and explore unforgettable events.</p>
            <div class="form-card">
            <div class="ticket-icon">🎫</div>

            <h2>Create Account</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Full Name"
                        required
                        pattern="\\s*(\\S\\s*){3,}" title="Name must have at least 3 characters"
                    />
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Email"  pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$" title="Please enter a valid Gmail address (@gmail.com)" required />
                </div>
                <span class="email-msg" id="emailError"></span>
            </div>
             <div class="input-group">
                <label for="phone">Phone Number</label>
                <input
                    type="text"
                    id="phone"
                    placeholder="Phone Number"
                    required
                    maxlength="10"
                    inputmode="numeric"
                />
                <span class="error-msg" id="phoneError"></span>
            </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required
                            minlength="8"
                            maxlength="12"
                            pattern="^(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,12}$"
                            title="Password must be 8-12 characters long, contain at least 1 uppercase letter and 1 special character"
                        />
                        <button type="button" class="eye-btn" onclick="togglePassword('password', this)">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm Password"
                            required
                        />
                        <button type="button" class="eye-btn" onclick="togglePassword('confirmPassword', this)">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="organizerCode">Organizer Code</label>
                    <input type="text" id="organizerCode" placeholder="Organizer code" />
                </div>

                <button type="submit">Create Account</button>
            </form>
            <p class="switch-link">
                Already have an account?
                <a href="login.html">Log in</a>
          </p>
            <script src="./js/api.js"></script>
            <script src="./js/register.js"></script>

        </div>
    </body>
</html>
