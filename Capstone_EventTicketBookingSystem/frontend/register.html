<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="./css/register.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="left-panel">
        <div class="overlay"></div>
        <div class="left-content">
          <h1>Evently.in</h1>
          <h2>Your next experience awaits</h2>
          <p>
            Book tickets for amazing events and create memories at Evently.in
          </p>
        </div>
      </div>

      <div class="right-panel">
        <div class="form-card">
          <h2>Create Account</h2>
          <p>Sign up and explore unforgettable events</p>

          <form id="registerForm">
            <div class="input-group">
              <input
                type="text"
                id="fullName"
                placeholder="Full Name"
                required
                        pattern="\s*(\S\s*){3,}" title="Name must have at least 3 characters"
              />
              <span class="error-msg" id="nameError"></span>
            </div>

            <div class="input-group">
              <input type="email" id="email" placeholder="Email"  pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$" title="Please enter a valid Gmail address (@gmail.com)" required />
              <span class="error-msg" id="emailError"></span>
            </div>

            <div class="input-group">
              <input
                  type="text"
                  id="phone"
                  placeholder="Phone Number"
                  required
                  maxlength="10"
                  inputmode="numeric"
              />
              <span class="error-msg" id="phoneError"></span>
            </div>

            <div class="input-group">
              <div class="password-wrapper">
                <input
                  type="password"
                  id="password"
                  placeholder="Password"
                  required
                  minlength="8"
                  maxlength="12"
                  pattern="^(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,12}$"
                  title="Password must be 8-12 characters long, contain at least 1 uppercase letter and 1 special character"
                />
                <button
                  type="button"
                  class="eye-btn"
                  onclick="togglePassword('password', this)"
                >
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
              <span class="error-msg" id="passwordError"></span>
            </div>

            <div class="input-group">
              <div class="password-wrapper">
                <input
                  type="password"
                  id="confirmPassword"
                  placeholder="Confirm Password"
                  required
                />
                <button
                  type="button"
                  class="eye-btn"
                  onclick="togglePassword('confirmPassword', this)"
                >
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
              <span class="error-msg" id="confirmPasswordError"></span>
            </div>

            <div class="input-group">
              <input type="text" id="organizerCode" placeholder="Organizer code (Optional)" />
            </div>

            <button type="submit">Create Account</button>
          </form>

          <p class="switch-link">
            Already have an account?
            <a href="login.html">Log in</a>
          </p>
        </div>
      </div>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/register.js"></script>
    <div class="toast" id="toast"></div>
  </body>
</html>
