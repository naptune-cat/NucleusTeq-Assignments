<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Organizer Dashboard</title>
    <link rel="stylesheet" href="./css/dashboard.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <h2>Evently 🎟</h2>
      <button onclick="logout()">Logout</button>
    </nav>
    <div id="welcome"></div>
    <!-- Main Layout -->
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <ul>
          <li onclick="showSection('dashboard')">🏠 Dashboard</li>
          <li onclick="showSection('events')">🎟 My Events</li>
          <li onclick="showSection('create')">➕ Create Event</li>
        </ul>
      </div>

      <!-- Content -->
      <div class="content">
        <!-- Dashboard -->
        <div id="dashboard" class="section">
          <h2>Dashboard</h2>
          <div class="cards">
            <div class="card">Total: <span id="total"></span></div>
            <div class="card">Active: <span id="active"></span></div>
            <div class="card">Past: <span id="past"></span></div>
            <div class="card">Cancelled: <span id="cancelled"></span></div>
          </div>
        </div>

        <!-- Events -->
        <div id="events" class="section hidden">
          <h2>My Events</h2>
          <div id="eventList"></div>
        </div>

        <!-- Create Event -->
        <div id="create" class="section hidden">
          <h2>Create Event</h2>

          <form id="eventForm">
            <input type="text" placeholder="Event Name" id="name" required />
            <input type="text" placeholder="Venue" id="venue" required />
            <input type="datetime-local" id="date" required />
            <input type="number" placeholder="Seats" id="seats" required />
            <input type="number" placeholder="Price" id="price" required />
            <input
              type="text"
              placeholder="Description"
              id="description"
              required
            />
            <input type="text" placeholder="Category" id="category" required />
            <button type="submit">Create</button>
          </form>
        </div>
      </div>
    </div>

    <script src="./js/dashboard.js"></script>
  </body>
</html>
